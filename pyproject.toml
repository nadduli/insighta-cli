[project]
name = "insighta-cli"
version = "0.1.0"
description = "Insighta Labs+ command-line interface"
readme = "README.md"
authors = [
    { name = "Nadduli Daniel", email = "naddulidaniel94@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.5",
    "httpx>=0.28.1",
    "rich>=13.9.4",
]

[project.scripts]
insighta = "insighta_cli.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "respx>=0.21.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "respx>=0.21.1",
]

[build-system]
requires = ["uv_build>=0.8.21,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["insighta_cli"]
